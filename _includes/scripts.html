<script>
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var nav = document.getElementById('nav');
    if (btn && nav) {
      btn.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }

    // Mobile menu: chevrons expand each tab's section list
    document.querySelectorAll('.sub-toggle').forEach(function (t) {
      t.addEventListener('click', function () { t.parentNode.classList.toggle('open'); });
    });
    // Close the mobile menu after jumping to a section on the same page
    if (nav) {
      nav.querySelectorAll('.sub a').forEach(function (a) {
        a.addEventListener('click', function () { nav.classList.remove('open'); if (btn) btn.setAttribute('aria-expanded', 'false'); });
      });
    }

    var themeBtn = document.querySelector('.theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    }
  })();
</script>
