<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </radialGradient>
    <radialGradient id="grade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset=".45" stop-color="#3b82f6"/>
      <stop offset=".62" stop-color="#a855f7"/>
      <stop offset=".8" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".35" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <g transform="translate(190 146) scale(.88)">
    <g fill="#14b8a6" opacity=".9">
      <g id="blade"><path d="M-6 -92 Q4 -118 -2 -134 L10 -134 Q18 -116 8 -92 Z"/></g>
      <use href="#blade" transform="rotate(20)"/><use href="#blade" transform="rotate(40)"/>
      <use href="#blade" transform="rotate(60)"/><use href="#blade" transform="rotate(80)"/>
      <use href="#blade" transform="rotate(100)"/><use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(140)"/><use href="#blade" transform="rotate(160)"/>
      <use href="#blade" transform="rotate(180)"/><use href="#blade" transform="rotate(200)"/>
      <use href="#blade" transform="rotate(220)"/><use href="#blade" transform="rotate(240)"/>
      <use href="#blade" transform="rotate(260)"/><use href="#blade" transform="rotate(280)"/>
      <use href="#blade" transform="rotate(300)"/><use href="#blade" transform="rotate(320)"/>
      <use href="#blade" transform="rotate(340)"/>
    </g>
    <circle r="96" fill="url(#grade)"/>
    <circle r="96" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
    <circle r="22" fill="#ffffff" stroke="#ffffff" stroke-opacity=".3"/>
    <circle r="58" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="3 4"/>
    <circle r="78" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="3 4"/>
  </g>
  <!-- DED nozzle -->
  <g transform="translate(250 6)">
    <path d="M-16 0 H16 V34 L6 62 H-6 L-16 34 Z" fill="#94a3b8"/>
    <rect x="-16" y="10" width="32" height="5" fill="#64748b"/>
    <rect x="-3" y="62" width="6" height="64" fill="url(#beam)"/>
    <circle cx="0" cy="128" r="16" fill="url(#glow)"/>
  </g>
  <g font-size="12" fill="#1f2937">
    <circle cx="350" cy="196" r="6" fill="#3b82f6"/><text x="362" y="200">IN718 (bore)</text>
    <circle cx="350" cy="220" r="6" fill="#a855f7"/><text x="362" y="224">INCOLOY 909</text>
    <circle cx="350" cy="244" r="6" fill="#14b8a6"/><text x="362" y="248">Monel K-500 (rim)</text>
  </g>
  <text x="20" y="282" font-size="11" fill="#5f6878">Schematic: radially graded blisk built by multi-material DED</text>
</svg>
