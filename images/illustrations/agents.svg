<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="50%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- links -->
  <g stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.6">
    <line x1="150" y1="70" x2="70" y2="140"/><line x1="150" y1="70" x2="230" y2="140"/>
    <line x1="70" y1="140" x2="100" y2="230"/><line x1="230" y1="140" x2="200" y2="230"/>
    <line x1="100" y1="230" x2="200" y2="230"/><line x1="150" y1="70" x2="100" y2="230"/>
    <line x1="150" y1="70" x2="200" y2="230"/><line x1="70" y1="140" x2="230" y2="140"/>
  </g>
  <g font-size="11" font-weight="600" text-anchor="middle">
    <g transform="translate(150 70)"><circle r="26" fill="#0ea5e9"/><text y="4" fill="#fff">Lead</text></g>
    <g transform="translate(70 140)"><circle r="26" fill="#6366f1"/><text y="4" fill="#fff">Design</text></g>
    <g transform="translate(230 140)"><circle r="26" fill="#6366f1"/><text y="4" fill="#fff">CAD</text></g>
    <g transform="translate(100 230)"><circle r="26" fill="#8b5cf6"/><text y="4" fill="#fff">FEA</text></g>
    <g transform="translate(200 230)"><circle r="26" fill="#10b981"/><text y="4" fill="#fff">Verify</text></g>
  </g>
  <!-- arrow to hardware -->
  <path d="M262 150 C 300 150, 300 150, 336 150" stroke="#fb923c" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <!-- turbine disk icon -->
  <g transform="translate(400 132)">
    <circle r="44" fill="#334155" stroke="#94a3b8"/>
    <g stroke="#64748b" stroke-width="3">
      <line x1="0" y1="-44" x2="0" y2="-56"/><line x1="31" y1="-31" x2="40" y2="-40"/><line x1="44" y1="0" x2="56" y2="0"/>
      <line x1="31" y1="31" x2="40" y2="40"/><line x1="0" y1="44" x2="0" y2="56"/><line x1="-31" y1="31" x2="-40" y2="40"/>
      <line x1="-44" y1="0" x2="-56" y2="0"/><line x1="-31" y1="-31" x2="-40" y2="-40"/>
    </g>
    <circle r="10" fill="#ffffff"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="150" y="282" fill="#5f6878">AI agent team</text>
    <text x="400" y="212" fill="#1f2937">design &#8594; build &#8594; test</text>
    <text x="400" y="228" fill="#5f6878">vs. human teams</text>
  </g>
  <text x="20" y="24" font-size="11" fill="#5f6878">Schematic: autonomous AI engineering team</text>
</svg>
