<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <radialGradient id="bg" cx="55%" cy="50%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- cylinder end view with radial bi-metal rings -->
  <g transform="translate(300 150)">
    <circle r="110" fill="#64748b"/>
    <circle r="92" fill="#cbd5e1"/>
    <circle r="74" fill="#64748b"/>
    <circle r="56" fill="#cbd5e1"/>
    <circle r="38" fill="#64748b"/>
    <circle r="20" fill="#cbd5e1"/>
    <circle r="110" fill="none" stroke="#475569" stroke-opacity=".5"/>
  </g>
  <!-- projectile -->
  <rect x="40" y="141" width="110" height="18" fill="url(#streak)"/>
  <path d="M150 138 H176 Q190 150 176 162 H150 Z" fill="#475569"/>
  <!-- impact sparks -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
    <line x1="186" y1="150" x2="200" y2="150"/><line x1="182" y1="132" x2="194" y2="122"/><line x1="182" y1="168" x2="194" y2="178"/>
  </g>
  <g font-size="12" fill="#1f2937">
    <rect x="22" y="228" width="12" height="12" fill="#cbd5e1" stroke="#64748b"/><text x="40" y="238">ductile alloy</text>
    <rect x="22" y="250" width="12" height="12" fill="#64748b"/><text x="40" y="260">strong alloy</text>
    <text x="22" y="100" fill="#c2410c">ultra-high-speed impact</text>
  </g>
  <text x="20" y="24" font-size="11" fill="#5f6878">Schematic: radial bi-metallic architecture</text>
</svg>
